<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>📦 Control de Pedidos — Aerografía79</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
  --bg:#020617;
  --panel:#020617;
  --border:rgba(148,163,184,.15);
  --ok:#22c55e;
  --warn:#f59e0b;
  --bad:#ef4444;
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:system-ui,Segoe UI;
  background:#020617;
  color:#e5e7eb;
}

header{
  text-align:center;
  padding:20px;
}

main{
  max-width:1100px;
  margin:auto;
  padding:16px;
}

.panel{
  border:1px solid var(--border);
  border-radius:16px;
  padding:16px;
  margin-bottom:16px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(12,1fr);
  gap:12px;
}

.col-3{grid-column:span 3}
.col-6{grid-column:span 6}
.col-12{grid-column:span 12}

label{
  font-size:.85rem;
  color:#94a3b8;
}

input,select,textarea{
  width:100%;
  padding:10px;
  border-radius:10px;
  border:1px solid var(--border);
  background:#020617;
  color:#e5e7eb;
}

textarea{min-height:80px}

button{
  padding:10px 14px;
  border-radius:12px;
  border:none;
  cursor:pointer;
  font-weight:700;
}

.primary{background:#38bdf8;color:#020617}
.secondary{background:#020617;color:#e5e7eb;border:1px solid var(--border)}

.table{
  width:100%;
  border-collapse:collapse;
}

.table th,.table td{
  padding:10px;
  border-bottom:1px solid var(--border);
}

.badge{
  padding:4px 8px;
  border-radius:999px;
  font-size:.75rem;
  font-weight:700;
}

.ok{background:rgba(34,197,94,.15);color:var(--ok)}
.warn{background:rgba(245,158,11,.15);color:var(--warn)}
.bad{background:rgba(239,68,68,.15);color:var(--bad)}

.actions{display:flex;gap:8px;flex-wrap:wrap}

@media(max-width:900px){
  .col-3,.col-6{grid-column:span 12}
}
</style>
</head>

<body>

<header>
  <h1>📦 Control de Pedidos</h1>
  <p>Compras a proveedores • estado • importes • exportación</p>
</header>

<main>

<section class="panel">
  <div class="grid">
    <div class="col-3">
      <label>📅 Fecha</label>
      <input type="date" id="fecha">
    </div>
    <div class="col-3">
      <label>🏪 Proveedor</label>
      <input id="proveedor">
    </div>
    <div class="col-3">
      <label>📦 Material</label>
      <input id="material">
    </div>
    <div class="col-3">
      <label>💶 Importe (€)</label>
      <input type="number" id="importe" step="0.01">
    </div>
    <div class="col-3">
      <label>📄 Ref</label>
      <input id="referencia">
    </div>
    <div class="col-3">
      <label>💡 Estado</label>
      <select id="estado">
        <option>Pendiente</option>
        <option>Recibido</option>
        <option>Cancelado</option>
      </select>
    </div>
    <div class="col-6">
      <label>📝 Notas</label>
      <textarea id="notas"></textarea>
    </div>

    <div class="col-12 actions">
      <button class="primary" id="guardar">💾 Guardar pedido</button>
      <button class="secondary" id="btnExport">💾 Exportar JSON</button>
      <button class="secondary" id="btnImport">📂 Importar JSON</button>
      <button class="secondary" id="btnPDF">📄 Exportar PDF</button>
      <input type="file" id="fileInput" hidden>
    </div>
  </div>
</section>

<section class="panel">
  <table class="table">
    <thead>
      <tr>
        <th>Fecha</th><th>Proveedor</th><th>Material</th>
        <th>Importe</th><th>Ref</th><th>Estado</th><th></th><th></th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
</section>

</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
const KEY='pedidos';
const tbody=document.getElementById('tbody');
const $=id=>document.getElementById(id);
let editIndex=null;

const read=()=>JSON.parse(localStorage.getItem(KEY)||'[]');
const save=d=>localStorage.setItem(KEY,JSON.stringify(d));

function badge(e){
  if(e==='Recibido')return'<span class="badge ok">Recibido</span>';
  if(e==='Cancelado')return'<span class="badge bad">Cancelado</span>';
  return'<span class="badge warn">Pendiente</span>';
}

function render(){
  tbody.innerHTML='';
  read().forEach((p,i)=>{
    const tr=document.createElement('tr');
    tr.innerHTML=`
      <td>${p.fecha}</td>
      <td>${p.proveedor}</td>
      <td>${p.material}</td>
      <td>${p.importe} €</td>
      <td>${p.referencia||''}</td>
      <td>${badge(p.estado)}</td>
      <td><button class="secondary" onclick="editar(${i})">✏️</button></td>
      <td><button class="secondary" onclick="borrar(${i})">🗑️</button></td>
    `;
    tbody.appendChild(tr);
  });
}

function editar(i){
  const p=read()[i];
  $('fecha').value=p.fecha;
  $('proveedor').value=p.proveedor;
  $('material').value=p.material;
  $('importe').value=p.importe;
  $('referencia').value=p.referencia;
  $('estado').value=p.estado;
  $('notas').value=p.notas||'';
  editIndex=i;
}

function borrar(i){
  const d=read();d.splice(i,1);save(d);render();
}

$('guardar').onclick=()=>{
  const pedido={
    fecha:$('fecha').value,
    proveedor:$('proveedor').value.trim(),
    material:$('material').value.trim(),
    importe:$('importe').value,
    referencia:$('referencia').value.trim(),
    estado:$('estado').value,
    notas:$('notas').value.trim()
  };

  if(!pedido.fecha||!pedido.proveedor||!pedido.material||!pedido.importe){
    alert('Completa los campos obligatorios');return;
  }

  const d=read();
  if(editIndex===null){
    pedido.creado=new Date().toISOString();
    d.push(pedido);
  }else{
    d[editIndex]={...d[editIndex],...pedido,modificado:new Date().toISOString()};
    editIndex=null;
  }

  save(d);render();
  ['fecha','proveedor','material','importe','referencia','estado','notas']
    .forEach(id=>$(id).value='');
};

$('btnExport').onclick=()=>{
  const n=new Date();
  const name=`control_de_pedidos_${String(n.getDate()).padStart(2,'0')}-${String(n.getMonth()+1).padStart(2,'0')}-${n.getFullYear()}.json`;
  const blob=new Blob([JSON.stringify(read(),null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();
};

$('btnImport').onclick=()=>$('fileInput').click();
$('fileInput').onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=ev=>{save(JSON.parse(ev.target.result));render();};
  r.readAsText(f);e.target.value='';
};

$('btnPDF').onclick=()=>{
  const {jsPDF}=window.jspdf;const doc=new jsPDF();let y=20;
  doc.text('📦 Control de Pedidos - Aerografía79',10,y);y+=10;
  read().forEach((p,i)=>{
    if(y>270){doc.addPage();y=20;}
    doc.text(`Pedido ${i+1} - ${p.fecha}`,10,y);y+=6;
    doc.text(`Proveedor: ${p.proveedor}`,10,y);y+=6;
    doc.text(`Material: ${p.material}`,10,y);y+=6;
    doc.text(`Importe: ${p.importe} €`,10,y);y+=6;
    doc.text(`Estado: ${p.estado}`,10,y);y+=8;
  });
  doc.save('control_de_pedidos.pdf');
};

render();
</script>

</body>
</html>
